name: civic_connect
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  equatable: ^2.0.8
  dartz: ^0.10.1
  flutter_riverpod: ^2.6.1
  uuid: ^4.5.3
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.1.1
  image_picker: ^1.2.2
  permission_handler: ^12.0.3
  path: ^1.9.1
  path_provider: ^2.1.6
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  google_fonts: ^8.2.0
  sensors_plus: ^7.1.0
  light_sensor: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  test_cov_console: ^0.2.2
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assests/images/
